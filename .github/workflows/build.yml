name: build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches-ignore: master

jobs:
  build-lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FishTrackerLambdaNode

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FishTrackerLambdaNode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build-validator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FishTrackerLambdaValidator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FishTrackerLambdaValidator/package-lock.json

      - name: Install dependencies
        run: npm ci

  test-angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:headless
